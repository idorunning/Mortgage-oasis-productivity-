<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mortgage Oasis</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f9f9f7; color: #0b0b0b;
    min-height: 100vh; display: grid; place-items: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0d0d; color: #ffffff; }
    .card { background: #1a1a19 !important; border-color: rgba(255,255,255,0.10) !important; }
    .muted { color: #c3c2b7 !important; }
  }
  .card {
    background: #fcfcfb; border: 1px solid rgba(11,11,11,0.10);
    border-radius: 12px; padding: 48px 56px; text-align: center; max-width: 460px;
  }
  h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
  .tagline { margin-top: 10px; font-size: 15px; }
  .muted { color: #52514e; }
  .admin-link {
    display: inline-block; margin-top: 28px; font-size: 14px; text-decoration: none;
    color: #2a78d6; border: 1px solid currentColor; border-radius: 8px; padding: 8px 18px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Mortgage Oasis</h1>
    <p class="tagline muted">Trusted mortgage &amp; protection advice.<br>Our new website is on its way.</p>
    <!-- Placeholder landing page. Replace with the real site before go-live. -->
    <a class="admin-link" href="admin/">Admin dashboard</a>
  </main>
</body>
</html>
